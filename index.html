<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kraken's Heist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020d16;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
      }

      /* Aviso de girar o aparelho: só em telas de toque na vertical. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        font-family: 'Lilita One', sans-serif;
        color: #ffd34d;
        background: radial-gradient(circle at 50% 40%, #2a0650 0%, #06263a 55%, #020d16 100%);
        text-shadow: 0 3px 0 #3b0d57;
      }
      #rotate h1 {
        margin: 0;
        font-size: 30px;
        font-weight: normal;
        letter-spacing: 1px;
      }
      #rotate p {
        margin: 0;
        font-size: 18px;
        color: #a8eaff;
        text-shadow: 0 2px 0 #06263a;
      }
      #rotate svg {
        width: 110px;
        height: 110px;
        animation: turn 2.2s ease-in-out infinite;
        filter: drop-shadow(0 0 18px rgba(124, 243, 255, 0.45));
      }
      @keyframes turn {
        0%,
        20% {
          transform: rotate(0deg);
        }
        50%,
        80% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate" role="alert">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect x="30" y="8" width="40" height="84" rx="8" fill="#0b3550" stroke="#ffd34d" stroke-width="4" />
        <rect x="36" y="18" width="28" height="60" rx="3" fill="#7cf3ff" opacity="0.35" />
        <circle cx="50" cy="85" r="3" fill="#ffd34d" />
      </svg>
      <h1>GIRE O CELULAR</h1>
      <p>Kraken's Heist é jogado na horizontal</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
